apiVersion: apps/v1
kind: Deployment
metadata:
  name: egov-ebt-mysql
  labels:
    app.kubernetes.io/name: egov-ebt-mysql
    app.kubernetes.io/part-of: egovframe-template
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: egov-ebt-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: egov-ebt-mysql
        app.kubernetes.io/part-of: egovframe-template
    spec:
      containers:
        - name: mysql
          image: mysql:8.0.39
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --default-time-zone=Asia/Seoul
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: ebt
            - name: MYSQL_USER
              value: ebt
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: egov-ebt-mysql
                  key: root-password
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: egov-ebt-mysql
                  key: password
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
        - name: initdb
          configMap:
            name: egov-ebt-mysql-initdb
