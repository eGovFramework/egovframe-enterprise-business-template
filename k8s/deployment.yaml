apiVersion: apps/v1
kind: Deployment
metadata:
  name: egov-ebt
  labels:
    app.kubernetes.io/name: egov-ebt
    app.kubernetes.io/part-of: egovframe-template
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: egov-ebt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: egov-ebt
        app.kubernetes.io/part-of: egovframe-template
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z -w2 mysql 3306; do echo waiting for mysql; sleep 2; done
        - name: prepare-webapp-dirs
          # Tomcat 이미지의 webapps/conf 는 root 소유라 non-root(1000)로는 WAR를 펼치지 못한다.
          # 이 initContainer만 root로 실행해 emptyDir로 복사·소유권 이전을 해 둔다(파드 기본
          # securityContext의 non-root 제약을 이 컨테이너에 한해 명시적으로 재정의).
          image: egov-ebt:5.0.0
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -c
            - |
              cp -a /usr/local/tomcat/webapps/. /work-webapps/
              mkdir -p /work-catalina/localhost
              chown -R 1000:1000 /work-webapps /work-catalina
          volumeMounts:
            - name: tomcat-webapps
              mountPath: /work-webapps
            - name: tomcat-catalina
              mountPath: /work-catalina
      containers:
        - name: app
          # Replace with your registry/tag, e.g. ghcr.io/<org>/egov-ebt:5.0.0
          # DB 접속 정보(호스트/계정)는 이미지 빌드시 globals.properties에 반영되어 있음 —
          # 이 앱은 Spring Boot가 아닌 Tomcat WAR이라 컨테이너 환경변수를 읽지 않는다.
          image: egov-ebt:5.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1.5Gi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tomcat-work
              mountPath: /usr/local/tomcat/work
            - name: tomcat-temp
              mountPath: /usr/local/tomcat/temp
            - name: tomcat-logs
              mountPath: /usr/local/tomcat/logs
            - name: tomcat-webapps
              mountPath: /usr/local/tomcat/webapps
            - name: tomcat-catalina
              mountPath: /usr/local/tomcat/conf/Catalina
      volumes:
        - name: tomcat-work
          emptyDir: {}
        - name: tomcat-temp
          emptyDir: {}
        - name: tomcat-logs
          emptyDir: {}
        - name: tomcat-webapps
          emptyDir: {}
        - name: tomcat-catalina
          emptyDir: {}
