apiVersion: apps/v1
kind: Deployment
metadata:
  name: egov-ebt
  labels:
    app.kubernetes.io/name: egov-ebt
    app.kubernetes.io/part-of: egovframe-template
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: egov-ebt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: egov-ebt
        app.kubernetes.io/part-of: egovframe-template
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z -w2 mysql 3306; do echo waiting for mysql; sleep 2; done
      containers:
        - name: app
          # Replace with your registry/tag, e.g. ghcr.io/<org>/egov-ebt:5.0.0
          # DB 접속 정보(호스트/계정)는 이미지 빌드시 globals.properties에 반영되어 있음 —
          # 이 앱은 Spring Boot가 아닌 Tomcat WAR이라 컨테이너 환경변수를 읽지 않는다.
          image: egov-ebt:5.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1.5Gi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tomcat-work
              mountPath: /usr/local/tomcat/work
            - name: tomcat-temp
              mountPath: /usr/local/tomcat/temp
            - name: tomcat-logs
              mountPath: /usr/local/tomcat/logs
      volumes:
        - name: tomcat-work
          emptyDir: {}
        - name: tomcat-temp
          emptyDir: {}
        - name: tomcat-logs
          emptyDir: {}
