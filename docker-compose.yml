services:
  app:
    build: .
    image: egov-ebt:5.0.0
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - Globals.Url=jdbc:log4jdbc:mysql://mysql-db:3306/${MYSQL_DATABASE:-ebt}?useSSL=false
      - Globals.UserName=${MYSQL_USER:-ebt}
      - Globals.Password=${MYSQL_PASSWORD:-ebt01}
    depends_on:
      mysql-db:
        condition: service_healthy
    restart: unless-stopped

  mysql-db:
    image: mysql:8.4
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --init-connect='SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci'
      --default-time-zone=Asia/Seoul
      --bind-address=0.0.0.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ebt}
      MYSQL_USER: ${MYSQL_USER:-ebt}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ebt01}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./DATABASE/mysql/all_ebt_ddl_mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./DATABASE/mysql/all_ebt_data_mysql.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u root --password=$${MYSQL_ROOT_PASSWORD:-admin} -e 'SELECT 1' || exit 1" ]
      interval: 1s
      timeout: 3s
      retries: 60
      start_period: 3s
    restart: unless-stopped

volumes:
  mysql-data: {}
